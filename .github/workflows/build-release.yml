name: Build & Release GFlowD APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "keystore_password=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$ANDROID_KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$ANDROID_KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "signing_mode=secret-keystore" >> "$GITHUB_OUTPUT"
          else
            storepass="gflowd-store-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            keypass="$storepass"
            alias="gflowd"
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -storetype JKS \
              -storepass "$storepass" \
              -keypass "$keypass" \
              -alias "$alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 9125 \
              -dname "CN=GFlowD, OU=GitHub Actions, O=prodject, L=NA, S=NA, C=US"
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "keystore_password=$storepass" >> "$GITHUB_OUTPUT"
            echo "key_alias=$alias" >> "$GITHUB_OUTPUT"
            echo "key_password=$keypass" >> "$GITHUB_OUTPUT"
            echo "signing_mode=generated-keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.keystore_password }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/GFlowD-${{ github.ref_name }}-signed.apk"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFlowD-signed-APK
          path: artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Automated signed APK build for tag `${{ github.ref_name }}`.
            Signing mode: `${{ steps.signing.outputs.signing_mode }}`.
          files: |
            artifacts/*.apk
