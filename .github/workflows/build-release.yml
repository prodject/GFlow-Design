name: Build & Release GFlowD APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK (if secret provided)
        id: sign_app
        uses: r2d2-tools/sign-android-release@v1
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK for Artifact Release
        run: |
          mkdir -p artifacts
          if ls app/build/outputs/apk/release/*-signed.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-signed.apk artifacts/GFlowD-Monji-13.2-release-signed.apk
          elif ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk artifacts/GFlowD-Monji-13.2-release.apk
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFlowD-APK
          path: artifacts/*.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: ${{ github.ref_name == 'main' && 'GFlowD Monji 13.2" Vertical (Latest Build)' || github.ref_name }}
          body: |
            Automated Release Build for GFlowD (13.2" Vertical Automotive Head Unit).
            
            - Tesla-style 3-Zone Ergonomic Layout
            - Complete 15 Functional Groups coverage
            - Native 2D Canvas Geely Cityray Model Visualizer
            - Vosk Offline Voice Assistant & AdaptAPI Diagnostics
          files: |
            artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
