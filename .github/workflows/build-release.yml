name: Build & Release GFlowD APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/GFlowD-Monji-13.2-release.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFlowD-APK
          path: artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Automated Release Build for GFlowD (13.2" Vertical Automotive Head Unit).
            
            - Tesla-style 3-Zone Ergonomic Layout
            - Complete 15 Functional Groups coverage
            - Native 2D Canvas Geely Cityray Model Visualizer
            - Vosk Offline Voice Assistant & AdaptAPI Diagnostics
          files: |
            artifacts/*.apk
